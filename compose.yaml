name: trama-foundation
services:
  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: trama_local
      POSTGRES_USER: trama_local
      POSTGRES_PASSWORD: ${TRAMA_DB_PASSWORD:?Run npm run db:setup first}
    ports:
      - "127.0.0.1:${TRAMA_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trama_local -d trama_local"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
